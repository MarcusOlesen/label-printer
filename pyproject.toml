[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-printer"
version = "4.3"
description = "Turns rows pasted from a Google Sheet into printable price labels (two per A4 page)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcus Olesen" }]
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4",
    "tksheet>=7",
    "pypdfium2>=4",  # label preview in the GUI
    "Pillow>=10",
    "sv-ttk>=2",  # dark theme
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]

[project.scripts]
label-printer = "label_printer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
label_printer = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
